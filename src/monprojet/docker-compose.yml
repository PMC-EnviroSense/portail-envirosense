services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: envirosense_db
      POSTGRES_USER: envirosense_user
      POSTGRES_PASSWORD: envirosense_pass
    ports:
      - "5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data: