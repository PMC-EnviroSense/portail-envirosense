services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: envirosense_db
      POSTGRES_USER: envirosense_user
      POSTGRES_PASSWORD: envirosense_pass
    ports:
      - "5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  # Broker MQTT : l'ESP32 publie ici, Django s'abonne ici
  mosquitto:
    image: eclipse-mosquitto:2
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - mosquitto

  # Client MQTT Django : recoit les messages et ecrit dans PostgreSQL
  mqtt:
    build: .
    command: python manage.py runmqtt
    restart: unless-stopped
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - mosquitto
      - web

volumes:
  postgres_data:
