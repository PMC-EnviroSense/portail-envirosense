<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Inscription - EnviroSense</title>
</head>
<body>
  <h1>Créer un compte</h1>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">S'inscrire</button>
  </form>

  <p>Déjà un compte ? <a href="{% url 'login' %}">Se connecter</a></p>
</body>
</html>
